name: market_tickers
# Pipeline thứ hai chạy song song với market_trades: cùng DB nguồn, cùng Debezium connector
# (topic prefix "market"), nhưng là 1 data flow riêng -> freeze/approve/registry độc lập.
detection:
  mode: event_driven
  kafka:
    bootstrap_servers: localhost:19092
    topic: market
  fallback_polling_interval_seconds: 60
source:
  type: postgres
  config:
    host: localhost
    port: 5431
    user: admin
    password: ${EXCHANGE_PG_PASSWORD}   # giá trị thật: config/secrets.env
    dbname: exchange
target:
  type: clickhouse
  config:
    host: localhost
    port: 8123
    user: default
    password: ${ANALYTICS_CH_PASSWORD}
    database: analytics
tables:
  - tickers
