name: market_tickers_replica
# Mức 3: sink có sẵn, không sửa code. Debezium JDBC sink (Kafka Connect) chép tickers sang Postgres replica.
# - Sink chỉ ghi dữ liệu (schema.evolution=none); engine giữ schema bảng replica như mọi target khác.
# - Bảng freeze -> engine pause connector; gỡ freeze -> resume + restart task FAILED.
detection:
  mode: event_driven
  kafka:
    bootstrap_servers: localhost:19092
    topic: market
  fallback_polling_interval_seconds: 60
source:
  type: postgres
  config:
    host: localhost
    port: 5431
    user: admin
    password: ${EXCHANGE_PG_PASSWORD}
    dbname: exchange
target:
  type: postgres
  config:
    host: localhost
    port: 5431
    user: admin
    password: ${EXCHANGE_PG_PASSWORD}   # cùng server Postgres với nguồn, khác database
    dbname: exchange_replica
tables:
  - tickers
components:
  - name: replica-sink
    role: Kafka Connect JDBC sink
    kafka_group: connect-market-tickers-replica
    kafka_connect:
      url: http://localhost:8083
      connector: market-tickers-replica
