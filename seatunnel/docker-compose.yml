networks:
  seatunnel-network:
    driver: bridge

services:
  seatunnel-master:
    image: apache/seatunnel:2.3.13
    hostname: seatunnel-master
    container_name: seatunnel-master
    environment:
      JVM_HEAP_OPTS: "-Xms6g -Xmx8g -XX:+UseG1GC"
    entrypoint: >
      /bin/sh -c "/opt/seatunnel/bin/seatunnel-cluster.sh -r master"    
    ports:
      - "5801:5801"
      - "8080:8080"
    volumes:
      - ./hazelcast-master.yaml:/opt/seatunnel/config/hazelcast-master.yaml
      - ./seatunnel.yaml:/opt/seatunnel/config/seatunnel.yaml
      - ./jvm_master_options:/opt/seatunnel/config/jvm_master_options
      - ./docker-data/seatunnel/imap:/opt/seatunnel/imap
      - ./docker-data/seatunnel/master/logs:/opt/seatunnel/logs
      - ./docker-data/seatunnel/checkpoint:/opt/seatunnel/checkpoint
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '6.0'
          memory: 12G
    networks:
      - seatunnel-network

  seatunnel-worker-1:
    image: apache/seatunnel:2.3.13
    hostname: seatunnel-worker-1
    container_name: seatunnel-worker-1
    entrypoint: >
      /bin/sh -c "/opt/seatunnel/bin/seatunnel-cluster.sh -r worker" 
    depends_on:
      - seatunnel-master
    deploy:
      resources:
        limits:
          cpus: '12.0'
          memory: 24G
    volumes:
      - ./hazelcast-worker-1.yaml:/opt/seatunnel/config/hazelcast-worker.yaml
      - ./seatunnel.yaml:/opt/seatunnel/config/seatunnel.yaml
      - ./jvm_worker_options:/opt/seatunnel/config/jvm_worker_options
      - ./docker-data/seatunnel/worker-1/logs:/opt/seatunnel/logs
      - ./docker-data/seatunnel/checkpoint:/opt/seatunnel/checkpoint
    restart: unless-stopped
    networks:
      - seatunnel-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:5801/hazelcast/health/node-state | grep -q ACTIVE || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 180s
