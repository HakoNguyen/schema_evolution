hazelcast:
  cluster-name: seatunnel
  network:
    rest-api:
      enabled: true
      endpoint-groups:
        HEALTH_CHECK:
          enabled: true
        CLUSTER_READ:
          enabled: true
        DATA:
          enabled: true
    port:
      auto-increment: true
      port: 5801
    join:
      multicast:
        enabled: false
      tcp-ip:
        enabled: true
        member-list:
          - seatunnel-master
